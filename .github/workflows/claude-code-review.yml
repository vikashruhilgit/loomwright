name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse rapid-fire pushes to the same PR into a single review of the latest
# state: a new run cancels any in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: a depth-1 shallow clone cannot resolve commits outside the PR
          # tip, so the reviewer cannot run `git cat-file -t <sha>` or
          # `git show <base>:<path>` to check claims against history. On PR #107
          # three separate review rounds each reported "shallow clone (depth 1) —
          # could not verify the base-commit SHAs" and had to take the author's
          # word for it. Full history makes those claims checkable.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            PROJECT CONTEXT:
            - This is a Claude Code plugin made of specialized agents and skills — current counts are documented in CLAUDE.md
            - Agents live in loomwright/agents/, skills in loomwright/skills/
            - Key config files: .claude-plugin/marketplace.json, loomwright/.claude-plugin/plugin.json
            - No build step — this is a markdown/config plugin, not a compiled app

            Please review this pull request and provide feedback on:
            - Agent/skill prompt quality and clarity
            - Configuration correctness (plugin.json, marketplace.json)
            - Documentation accuracy
            - Potential issues or improvements

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Additionally, watch for these recurring behavioral/doc miss-classes (defined in loomwright/skills/quality-checklist/SKILL.md "Self-Heal Miss-Class Checklist") and call out any you see, mapping the signal to this repo's languages where relevant:
            - validation parity — a client/frontend-enforced rule with no equivalent server/API-boundary check
            - numeric falsy coercion — `||`/`!x`/truthiness on a numeric or boolean field where 0/false/"" is legitimate
            - positional args vs options object misuse — a call site whose argument shape doesn't match an options-object callee
            - missing branch coverage — a new if/else/switch/ternary/error path with no test exercising each branch
            - count/version/restated-list drift — a count, version, or restated list changed in one file but not the others that mirror it
            - cross-reference precision drift — a "see X" / file:line / canonical-name reference that no longer points where it claims

            This is your own independent checklist as a reviewer — apply your own judgment; do not try to match or converge with any other reviewer's findings.

            On a large PR, `gh pr diff` alone will not fit and is not enough to judge
            anything. Read the changed files directly, and compare a file against its
            base version with `git show HEAD^1:<path>` — on a pull_request event CI
            checks out the PR's merge commit, whose FIRST parent is the base branch tip.
            (`git show "$(git merge-base HEAD origin/main)":<path>` also works when an
            `origin/main` remote-tracking ref is present, but `HEAD^1` needs no remote
            ref.) You have the full history and the working tree.

            DO NOT try to post your review yourself — you have no tool for it, and you
            do not need one. YOUR FINAL MESSAGE IS THE REVIEW COMMENT: a later workflow
            step reads it out of the execution trace and posts it verbatim to the PR.
            Write that final message as the review itself, in markdown, addressed to the
            PR author — not as a summary of a review you delivered somewhere else, and
            not as a report on what you did.

            So if you run low on turns, or could not examine everything you wanted to,
            put what you DO have in that final message plus an explicit note about what
            you could not cover. Ending with a bare status line ("Review complete",
            "Posted my findings") publishes exactly that line and nothing else. In fact
            the posting step rejects any final message shorter than ~200 bytes and posts
            NOTHING at all, so a terse sign-off is not a quiet pass — it is silence. If
            you genuinely found nothing worth raising, say so and spell out what you
            checked and how, so the PR author can judge the coverage.

          # No --model or --effort pin: inherit the action's defaults.
          #
          # --allowed-tools REPLACES the defaults, it does not extend them. Until
          # 2026-08-12 this list held only the seven `gh` entries, which left the
          # reviewer with no Read, no Grep, no Glob and no git — its only window into
          # the code was `gh pr diff`. That silently starved it on any PR big enough to
          # need file-level verification: on PR #140 (35 files, +7,387) nine runs of
          # this workflow all concluded `success` and eight of them posted NOTHING —
          # the PR carries exactly one claude-authored comment and zero reviews — while
          # the check showed green throughout. Note that
          # `fetch-depth: 0` above was added so the reviewer could run `git cat-file` /
          # `git show <base>:<path>` — commands the allowlist never actually permitted,
          # so that intent had never once worked. Read/Grep/Glob and read-only git are
          # therefore explicit here.
          #
          # What this list guarantees is narrow, and it is NOT "read-only": there is no
          # Write tool, no Edit tool, and no bare `Bash(...)` wildcard — that is all.
          # One known write path survives inside it: `--output=<file>` is a standard
          # diff option accepted by `git diff`, `git log` AND `git show` (all three
          # prefix-globbed here) and overwrites an arbitrary file with no shell
          # chaining, verified rc=0 on git 2.50.1. The blast radius is bounded by the
          # environment rather than by the allowlist: the runner is ephemeral, and the
          # job token is `contents: read`, so nothing written to the checkout can be
          # pushed.
          #
          # `Bash(gh pr comment:*)` was dropped on 2026-08-13 when posting moved into
          # the workflow step below (see its comment for why). That also retires the
          # `gh pr comment --delete-last` mutate path this comment used to name.
          # `Bash(git branch:*)` was deliberately dropped — its prefix glob admitted
          # `-d/-D`, `-m/-M`, `-c/-C`, `-f`, `--set-upstream-to` and
          # `--edit-description` (which spawns core.editor), and nothing in the prompt
          # needs it; file-level verification is covered by show/cat-file/log/diff/
          # blame/ls-files/rev-parse/merge-base.
          #
          # Self-test caveat: claude-code-action SKIPS any PR that modifies a workflow
          # file (it exits 0 with a "workflow validation failed" annotation and posts
          # nothing), so a change to this file can never be validated by its own PR.
          # Validate it on the next NON-workflow PR, and assert on a posted comment —
          # a green check is exactly the signal this change exists to stop trusting.
          # Kept on ONE line on purpose: a YAML folded scalar (`>-`) joins its lines
          # with a space, which would inject a leading space into every wrapped tool
          # name (`" Bash(git blame:*)"`) and is not worth betting the allowlist on.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git cat-file:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # The execution trace, kept regardless of the review step's outcome (when there is
      # a file to keep) and BEFORE the posting step, so a run that fails to produce a
      # review can still be diagnosed. The 2026-08-12 silent run
      # (31621575301) could not be explained from the job log at all: it reported
      # `num_turns: 13` and `permission_denials_count: 4` and nothing about WHICH tool
      # calls were denied, because the job log carries only the init and result records.
      # This artifact carries the whole conversation, tool calls included.
      # `!cancelled()`, not `always()`: `always()` also runs a step while the job is being
      # CANCELLED, which is exactly the state `cancel-in-progress: true` above puts a
      # superseded run into. See the posting step below for why that matters there.
      - name: Upload the reviewer's execution trace
        if: ${{ !cancelled() && steps.claude-review.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-trace-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 14

      # POSTING IS THE WORKFLOW'S JOB, NOT THE MODEL'S — and a review that produced no
      # text FAILS this job instead of passing quietly.
      #
      # Why it moved here. Asking the model to call `gh pr comment` itself made posting
      # depend on it choosing to, and on PR #140 it repeatedly did not: nine runs of this
      # workflow all concluded `success` while eight posted nothing. Even after the
      # allowlist fix restored Read/Grep/Glob and git — which measurably helped, denials
      # fell 58 -> 4 — run 31621575301 still ended silent. A step that reads the final
      # message out of the trace and posts it cannot forget, and it cannot be denied.
      #
      # The `exit 1` is the actual repair for the reported problem, which was never
      # "the reviewer is quiet" but "quiet is indistinguishable from clean". This check
      # is not in main's required contexts, so a red run here blocks nobody; it just
      # stops silence from rendering as a green tick. Note the inverse is NOT claimed:
      # a green tick means a comment was posted, not that the review was any good.
      #
      # `!cancelled()` rather than `always()` so this runs whether the review step passed
      # or failed, but NOT while the job is being cancelled. Under `always()` a run that
      # `cancel-in-progress: true` superseded would still post its review of now-stale
      # code, alongside the review the newer run posts — two comments for one PR state,
      # which is the duplication the concurrency block exists to prevent.
      - name: Post the review, and fail if there is nothing to post
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # No trace at all = the action never ran. The routine cause is benign and
          # expected: claude-code-action skips any PR that touches a workflow file. That
          # is not a silent review to be failed on, so it exits 0 with a loud notice.
          if [ -z "${EXEC_FILE:-}" ] || [ ! -s "$EXEC_FILE" ]; then
            echo "::warning title=No reviewer trace::claude-code-action produced no execution file — it was skipped (expected on any PR that modifies a workflow file) or died before starting. No review was posted."
            exit 0
          fi

          # The trace is SDK messages, and BOTH shapes are handled on purpose: a single
          # JSON array, or JSONL with one record per line. `-s` plus `flatten(1)` yields
          # the same flat message list either way — without `-s`, jq would run the filter
          # once PER RECORD on a JSONL file and emit one candidate body per record
          # instead of one for the run. flatten(1) is safe here because the elements are
          # objects, never arrays.
          #
          # Prefer the result record's own `result` string; fall back to the last
          # assistant text block. `// empty` rather than `// ""` so null and missing both
          # collapse to no output, and `-r` so markdown is emitted raw, not JSON-quoted.
          #
          # `is_error != true` on the result record is deliberate: an errored run still
          # carries a `result` string, and it holds an error message rather than a review
          # — easily long enough to clear the 200-byte floor below and be posted verbatim
          # as though it were one, footer and all, while the job concludes success.
          # Excluding it makes an errored run fall through to the assistant-text fallback
          # and, failing that, to the loud empty-body path, so "errored" cannot render as
          # "reviewed". `!= true` not `== false` so a missing key still counts as fine.
          #
          # jq's own status and stderr are captured rather than discarded: swallowing them
          # would turn a parse or shape failure into an empty body, which the emptiness
          # branch below would then misreport as the reviewer saying nothing.
          BODY_FILE="$RUNNER_TEMP/claude-review-body.md"
          JQ_ERR_FILE="$RUNNER_TEMP/claude-review-jq.err"
          jq -s -r '
            flatten(1)
            | (map(select(.type == "result" and .is_error != true) | .result // empty) | last)
              // (map(select(.type == "assistant")
                     | .message.content // []
                     | map(select(.type == "text") | .text)
                     | join("\n"))
                  | map(select(length > 0)) | last)
              // empty
          ' "$EXEC_FILE" > "$BODY_FILE" 2>"$JQ_ERR_FILE"
          JQ_RC=$?

          # A non-zero jq is a shape/parse failure, not silence — report it as its own
          # thing, BEFORE the emptiness test that would otherwise absorb it.
          if [ "$JQ_RC" -ne 0 ]; then
            echo "::error title=Trace shape changed::jq exited ${JQ_RC} reading the execution trace, so no review could be extracted. This is a parse or shape failure, not a quiet reviewer. Download the 'claude-review-trace-*' artifact from this run to see the trace."
            echo "--- jq stderr ---"
            cat "$JQ_ERR_FILE"
            exit 1
          fi

          # Guard the shape too, not just the emptiness: if the trace stops matching what
          # this jq expects, say so with the keys actually present rather than reporting
          # a structural change as "the reviewer said nothing".
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error title=Review produced no text::The reviewer ran but its final message was empty, so there is nothing to post. Download the 'claude-review-trace-*' artifact from this run to see what it did."
            echo "--- record types present in the trace ---"
            # Same `-s` + flatten(1) slurp as the extraction above, for the same reason:
            # without it, a JSONL trace runs this filter once per record and prints one
            # line per record instead of the run's unique type set.
            jq -s -r 'flatten(1) | map(.type // "?") | unique | join(", ")' "$EXEC_FILE" 2>/dev/null \
              || echo "(the trace is not parseable as JSON — its shape has changed)"
            exit 1
          fi

          # A bare status line is the failure mode the prompt warns about ("Review
          # complete"), and publishing it would look like a clean review. 200 bytes (what
          # `wc -c` counts, not characters) is comfortably below any real review and
          # comfortably above any such line.
          BYTES=$(wc -c < "$BODY_FILE")
          if [ "$BYTES" -lt 200 ]; then
            echo "::error title=Review too short to be a review::The reviewer's final message was only ${BYTES} bytes — that is a status line, not a review, and posting it would read as a clean bill of health. Nothing was posted."
            cat "$BODY_FILE"
            exit 1
          fi

          printf '\n\n---\n<sub>Posted by the `Claude Code Review` workflow from the reviewer'"'"'s final message (run %s).</sub>\n' "$GITHUB_RUN_ID" >> "$BODY_FILE"

          if ! gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"; then
            # Single quotes around the tool name on purpose: backticks inside a
            # double-quoted string are command substitution, and would re-run the very
            # command whose failure is being reported.
            echo "::error title=Could not post the review::The reviewer produced ${BYTES} bytes of review, but 'gh pr comment' failed. The text is in the step log above and in the trace artifact."
            exit 1
          fi
          echo "Posted ${BYTES} bytes of review to PR #${PR_NUMBER}."
