name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse rapid-fire pushes to the same PR into a single review of the latest
# state: a new run cancels any in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: a depth-1 shallow clone cannot resolve commits outside the PR
          # tip, so the reviewer cannot run `git cat-file -t <sha>` or
          # `git show <base>:<path>` to check claims against history. On PR #107
          # three separate review rounds each reported "shallow clone (depth 1) —
          # could not verify the base-commit SHAs" and had to take the author's
          # word for it. Full history makes those claims checkable.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            PROJECT CONTEXT:
            - This is a Claude Code plugin made of specialized agents and skills — current counts are documented in CLAUDE.md
            - Agents live in loomwright/agents/, skills in loomwright/skills/
            - Key config files: .claude-plugin/marketplace.json, loomwright/.claude-plugin/plugin.json
            - No build step — this is a markdown/config plugin, not a compiled app

            Please review this pull request and provide feedback on:
            - Agent/skill prompt quality and clarity
            - Configuration correctness (plugin.json, marketplace.json)
            - Documentation accuracy
            - Potential issues or improvements

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Additionally, watch for these recurring behavioral/doc miss-classes (defined in loomwright/skills/quality-checklist/SKILL.md "Self-Heal Miss-Class Checklist") and call out any you see, mapping the signal to this repo's languages where relevant:
            - validation parity — a client/frontend-enforced rule with no equivalent server/API-boundary check
            - numeric falsy coercion — `||`/`!x`/truthiness on a numeric or boolean field where 0/false/"" is legitimate
            - positional args vs options object misuse — a call site whose argument shape doesn't match an options-object callee
            - missing branch coverage — a new if/else/switch/ternary/error path with no test exercising each branch
            - count/version/restated-list drift — a count, version, or restated list changed in one file but not the others that mirror it
            - cross-reference precision drift — a "see X" / file:line / canonical-name reference that no longer points where it claims

            This is your own independent checklist as a reviewer — apply your own judgment; do not try to match or converge with any other reviewer's findings.

            On a large PR, `gh pr diff` alone will not fit and is not enough to judge
            anything. Read the changed files directly, and use `git show <base>:<path>`
            to compare against the base — you have the full history and the working tree.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on
            the PR. Posting is not optional and it is the LAST thing you do: if you run
            low on turns, or could not examine everything you wanted to, post what you
            DO have plus an explicit note about what you could not cover. A run that
            ends without a posted comment is indistinguishable from no review at all —
            the workflow still goes green, so silence reads as "clean" to everyone.

          # No --model or --effort pin: inherit the action's defaults.
          #
          # --allowed-tools REPLACES the defaults, it does not extend them. Until
          # 2026-08-12 this list held only the seven `gh` entries, which left the
          # reviewer with no Read, no Grep, no Glob and no git — its only window into
          # the code was `gh pr diff`. That silently starved it on any PR big enough to
          # need file-level verification: on PR #140 (35 files, +7,387) five successive
          # runs finished `subtype: success` / `is_error: false` with 7→58 permission
          # denials each and posted NOTHING, while the check showed green. Note that
          # `fetch-depth: 0` above was added so the reviewer could run `git cat-file` /
          # `git show <base>:<path>` — commands the allowlist never actually permitted,
          # so that intent had never once worked. Read/Grep/Glob and read-only git are
          # therefore explicit here. Everything listed is read-only by construction:
          # no Write, no Edit, and no bare `Bash(...)` wildcard.
          # Kept on ONE line on purpose: a YAML folded scalar (`>-`) joins its lines
          # with a space, which would inject a leading space into every wrapped tool
          # name (`" Bash(git blame:*)"`) and is not worth betting the allowlist on.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git cat-file:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git branch:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
