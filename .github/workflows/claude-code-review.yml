name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse rapid-fire pushes to the same PR into a single review of the latest
# state: a new run cancels any in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: a depth-1 shallow clone cannot resolve commits outside the PR
          # tip, so the reviewer cannot run `git cat-file -t <sha>` or
          # `git show <base>:<path>` to check claims against history. On PR #107
          # three separate review rounds each reported "shallow clone (depth 1) —
          # could not verify the base-commit SHAs" and had to take the author's
          # word for it. Full history makes those claims checkable.
          fetch-depth: 0

      # Stamped BEFORE the reviewer runs so the posted-comment assertion below can tell
      # THIS run's comment from one left by an earlier run on the same PR.
      - name: Stamp run start
        id: stamp
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            PROJECT CONTEXT:
            - This is a Claude Code plugin made of specialized agents and skills — current counts are documented in CLAUDE.md
            - Agents live in loomwright/agents/, skills in loomwright/skills/
            - Key config files: .claude-plugin/marketplace.json, loomwright/.claude-plugin/plugin.json
            - No build step — this is a markdown/config plugin, not a compiled app

            Please review this pull request and provide feedback on:
            - Agent/skill prompt quality and clarity
            - Configuration correctness (plugin.json, marketplace.json)
            - Documentation accuracy
            - Potential issues or improvements

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Additionally, watch for these recurring behavioral/doc miss-classes (defined in loomwright/skills/quality-checklist/SKILL.md "Self-Heal Miss-Class Checklist") and call out any you see, mapping the signal to this repo's languages where relevant:
            - validation parity — a client/frontend-enforced rule with no equivalent server/API-boundary check
            - numeric falsy coercion — `||`/`!x`/truthiness on a numeric or boolean field where 0/false/"" is legitimate
            - positional args vs options object misuse — a call site whose argument shape doesn't match an options-object callee
            - missing branch coverage — a new if/else/switch/ternary/error path with no test exercising each branch
            - count/version/restated-list drift — a count, version, or restated list changed in one file but not the others that mirror it
            - cross-reference precision drift — a "see X" / file:line / canonical-name reference that no longer points where it claims

            This is your own independent checklist as a reviewer — apply your own judgment; do not try to match or converge with any other reviewer's findings.

            On a large PR, `gh pr diff` alone will not fit and is not enough to judge
            anything. Read the changed files directly, and compare a file against its
            base version with `git show HEAD^1:<path>` — on a pull_request event CI
            checks out the PR's merge commit, whose FIRST parent is the base branch tip.
            (`git show "$(git merge-base HEAD origin/main)":<path>` also works when an
            `origin/main` remote-tracking ref is present, but `HEAD^1` needs no remote
            ref.) You have the full history and the working tree.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on
            the PR. Posting is not optional and it is the LAST thing you do: if you run
            low on turns, or could not examine everything you wanted to, post what you
            DO have plus an explicit note about what you could not cover. A run that
            ends without a posted comment is indistinguishable from no review at all —
            the workflow still goes green, so silence reads as "clean" to everyone.

            EVERY completed run posts exactly one comment — including when you find
            nothing. "No new findings" is a review result, not an excuse to stay
            silent; a re-review run whose commits merely address your own earlier
            findings still posts. In that case post a short comment that starts with
            `Reviewed <sha>: no new findings` (use `git rev-parse HEAD^2` for the PR
            head sha — HEAD is the merge commit, its SECOND parent is the PR tip) and
            then, in a sentence or two, say what you examined and, if this is a
            re-review, confirm which earlier findings the new commits addressed. Do
            not compress this to a bare one-liner: a completion check on this workflow
            only counts comments longer than 200 characters as a posted review, so a
            one-line "no new findings" still registers as silence.

          # No --model or --effort pin: inherit the action's defaults.
          #
          # --allowed-tools REPLACES the defaults, it does not extend them. Until
          # 2026-08-12 this list held only the seven `gh` entries, which left the
          # reviewer with no Read, no Grep, no Glob and no git — its only window into
          # the code was `gh pr diff`. That silently starved it on any PR big enough to
          # need file-level verification: on PR #140 (35 files, +7,387) nine runs of
          # this workflow all concluded `success` and eight of them posted NOTHING —
          # the PR carries exactly one claude-authored comment and zero reviews — while
          # the check showed green throughout. Note that
          # `fetch-depth: 0` above was added so the reviewer could run `git cat-file` /
          # `git show <base>:<path>` — commands the allowlist never actually permitted,
          # so that intent had never once worked. Read/Grep/Glob and read-only git are
          # therefore explicit here.
          #
          # What this list guarantees is narrow, and it is NOT "read-only": there is no
          # Write tool, no Edit tool, and no bare `Bash(...)` wildcard — that is all.
          # Every entry is a PREFIX glob, so each one admits whatever flags its command
          # accepts, and several accept flags that write. Known paths that survive:
          #   1. `--output=<file>` is a standard diff option accepted by `git diff`,
          #      `git log` AND `git show` (all three prefix-globbed here) and overwrites
          #      an arbitrary file with no shell chaining — verified rc=0 on git 2.50.1.
          #   2. `sort -o <file>` writes its output to an arbitrary file, same shape.
          #   3. `gh pr comment --delete-last` removes a comment.
          #   4. `cat` and `jq` reach the environment (`jq -n 'env.FOO'`,
          #      `cat /proc/self/environ`), and `gh pr comment` can publish whatever
          #      they read — on a public repo that is an egress channel, not just a
          #      local read. The OAuth token is the thing worth guarding there.
          # The blast radius is bounded by the environment rather than by the allowlist:
          # the runner is ephemeral, and the job token is `contents: read`, so nothing
          # written to the checkout can be pushed.
          # Two entries were deliberately dropped rather than left to that bound:
          # `Bash(git branch:*)`, whose prefix glob admitted `-d/-D`, `-m/-M`, `-c/-C`,
          # `-f`, `--set-upstream-to` and `--edit-description` (which spawns
          # core.editor); and `Bash(find:*)`, which is strictly worse — `find . -name X
          # -exec sh -c '<anything>' \;` runs an ARBITRARY command (verified) and
          # `-delete` removes files, which would make every other entry on this list
          # decorative. Neither is needed: file-level verification is covered by
          # show/cat-file/log/diff/blame/ls-files/rev-parse/merge-base, and file
          # discovery by `Glob` plus `Bash(git ls-files:*)`.
          #
          # 2026-09-04 — `Bash(grep:*)` added, plus `cmp`/`comm`/`basename`/`dirname`.
          # The list granted the `Grep` TOOL but not the `grep` COMMAND, and on a diff that is
          # mostly bash and jq a reviewer reaches for `grep -c` in Bash constantly; every such
          # call was refused and burned a turn. Measured across four runs on PR #177:
          #
          #   head      result   turns  denials  productive (turns - denials)
          #   7efb64d   POSTED      53       12  41
          #   2337397   silent      27       12  15
          #   f7983cf   silent      16        5  11
          #   0abd91e   silent      44       39   5
          #
          # That data FALSIFIES the denial-RATIO advice this file prints in the guard below
          # (see the corrected text there): the run that posted sat at 23% denials while a
          # silent one sat at 31%. Ratio does not separate them; PRODUCTIVE TURNS does — the
          # reviewer needs roughly 20+ turns of real work to finish reading and reach the
          # mandated post, and denials eat that budget directly.
          #
          # Each addition was checked against the write/exec test this list already applies,
          # and the ones that FAIL it were deliberately NOT added, for the same reason
          # `Bash(find:*)` was dropped above:
          #   * `awk` — `awk 'BEGIN{system("...")}'` executes arbitrary commands.
          #   * `xargs` — executes arbitrary commands by construction.
          #   * `sed`  — `sed -i` rewrites files in place.
          #   * `bash`/`sh`/`python3`/`node` — arbitrary execution, obviously.
          # `grep`, `cmp`, `comm`, `basename` and `dirname` write only to stdout and have no
          # exec primitive, so they add reach without widening the blast radius.
          #
          # Diagnosability gap, and why it is LEFT OPEN rather than closed (2026-09-04):
          # this job's log records only the aggregate `permission_denials_count` — never WHICH
          # command was refused — so the allowlist fix above is INFERRED, not read off a run.
          # The obvious levers were checked against the action's documented inputs and rejected:
          #   * `display_report: true` prints the Claude-authored report to the Step Summary. It
          #     is not documented to name denied tool calls.
          #   * `show_full_output: true` prints full tool RESULTS (successes), is likewise not
          #     documented to name denials, and the action's own security guide warns it can
          #     surface secrets and API keys.
          #   * `--debug` / `ACTIONS_STEP_DEBUG` enable deeper logging and auto-enable
          #     show_full_output; also not documented to name denials.
          # THIS REPOSITORY IS PUBLIC, so all three would publish that content into
          # world-readable logs in exchange for a diagnostic none of them promises. Do not
          # enable any of them here to chase a denial list. If this needs solving properly,
          # reproduce locally with `claude --debug --allowed-tools "<this list>"`, or ask
          # upstream (anthropics/claude-code-action) whether denials can be surfaced.
          #
          # Self-test caveat: claude-code-action SKIPS any PR that modifies a workflow
          # file (it exits 0 with a "workflow validation failed" annotation and posts
          # nothing), so a change to this file can never be validated by its own PR.
          # Validate it on the next NON-workflow PR, and assert on a posted comment —
          # a green check is exactly the signal this change exists to stop trusting.
          # Kept on ONE line on purpose: a YAML folded scalar (`>-`) joins its lines
          # with a space, which would inject a leading space into every wrapped tool
          # name (`" Bash(git blame:*)"`) and is not worth betting the allowlist on.
          claude_args: '--allowed-tools "Read,Grep,Glob,Task,TodoWrite,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git cat-file:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git status:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(diff:*),Bash(ls:*),Bash(grep:*),Bash(cmp:*),Bash(comm:*),Bash(basename:*),Bash(dirname:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # ---------------------------------------------------------------------
      # A run that ends without a posted comment is indistinguishable from no
      # review at all — the prompt above says so, and until now nothing enforced
      # it: the action exits `is_error: false` and the check goes green whether
      # or not a review was delivered. Measured on PR #147, nine runs all
      # concluded `success` and only THREE posted; the six silent ones cost
      # ~$21 and produced nothing a human could read. Silence read as "clean".
      #
      # This step makes that visible. It is deliberately NOT a required check
      # (branch protection on `main` requires `ci` only), so a red mark here
      # reports "this PR was not actually reviewed" without blocking a merge —
      # the human decides what to do about it.
      #
      # A comment counts only if it was authored by `claude[bot]` (the reviewer's
      # own login, confirmed against the live comments API on PR #147), postdates
      # this run's own start stamp (so an earlier run's review cannot satisfy a
      # later run), and is longer than 200 characters — PR #147 collected a
      # literal 4-character "test" comment from a reviewer probing its tool
      # permissions, which must not count as review. The 200-char floor is
      # RESTATED in the review prompt above (its no-findings paragraph tells the
      # reviewer a one-liner won't count) — change both together, or a compliant
      # short comment under a raised floor re-creates the false red PR #150 fixed. The author clause is not
      # cosmetic: without it ANY actor satisfies the assertion. On PR #147 a
      # 5418-character human comment (`vikashruhilgit`, 2026-08-15T04:11:02Z)
      # sat between two `claude[bot]` comments and would have covered for a
      # silent run.
      #
      # No `always()` here. It was redundant on the failure path — the outcome
      # test already excludes a failed reviewer — but it also made this step run
      # during job CANCELLATION, which is routine on this workflow
      # (`cancel-in-progress: true` + `synchronize`), turning a merely superseded
      # run into a spurious "posted NO comment" error.
      - name: Assert a review was actually posted
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.stamp.outputs.since }}
        run: |
          set -uo pipefail
          # `set -u` does NOT catch set-but-EMPTY, and this step runs under `bash -e`, where
          # a failing `date` in the stamp step still writes a literal `since=` to
          # $GITHUB_OUTPUT with rc=0. An empty SINCE makes the anti-replay filter below
          # vacuous — `select(.created_at >= "")` is true for a comment from 2020 — so a
          # stale review from an earlier run would silently satisfy this run. Skip loudly
          # instead. Not a failure: a broken stamp is not evidence the PR went unreviewed.
          if [ -z "${SINCE}" ]; then
            echo "::warning::run-start stamp is empty — the anti-replay filter would accept a comment of any age, so this assertion is skipped rather than run vacuously."
            exit 0
          fi
          # claude-code-action SELF-SKIPS any PR that modifies a workflow file (it warns
          # "Skipping action due to workflow validation", exits 0, and posts nothing) — the
          # header above already documents this. That skip leaves steps.claude-review.outcome
          # == 'success', so without this branch the assertion reports a false "not reviewed"
          # on every workflow PR. Caught by this very step on its own first run (PR #148).
          # No pipe into grep here: `producer | grep -q` returns 141 under `pipefail` EVEN ON
          # A MATCH, which would silently turn this guard into a no-op.
          # Match PER LINE against an ANCHORED pattern, not `case "$changed" in
          # *.github/workflows/*)` over the whole blob: the unanchored form also matched
          # `docs/examples/.github/workflows/sample.yml` and `weird.github/workflows/x`
          # (both verified), neither of which triggers the action's self-skip — and this
          # repo ships example trees, so that no-oped the assertion on ordinary PRs.
          # A here-string, not a pipe: `... | while read` runs the loop in a subshell and
          # the flag set inside it would not survive. `.github/dependabot.yml` still does
          # not match, as before.
          changed="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          workflow_touched=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*) workflow_touched=1 ;;
            esac
          done <<< "$changed"
          if [ "$workflow_touched" -eq 1 ]; then
            echo "::notice::PR modifies a workflow file — claude-code-action self-skips these, so there is no review to assert here. Validate this workflow on the next NON-workflow PR."
            exit 0
          fi
          # `--paginate` with `--jq` applies the filter to EACH page and concatenates the
          # outputs, so a `| length` filter emits one number PER PAGE ("0\n1") rather than a
          # total. Emit one id per line and count lines instead — correct at any comment count.
          # The author clause comes FIRST because it is the one that decides whose silence
          # this step is measuring; see the header above for what it cost to omit it.
          if ! ids="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                        --paginate --jq \
                        ".[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${SINCE}\") | select(.body | length > 200) | .id" \
                      2>/dev/null)"; then
            echo "::warning::could not read PR comments to verify a review was posted — not failing on an unreadable check"
            exit 0
          fi
          # An unreadable API is a WARNING (above); zero comments from a readable API is the
          # finding. Keep those two apart, or an outage silently reads as "not reviewed".
          posted="$(printf '%s' "$ids" | grep -c . || true)"
          if [ "${posted:-0}" -gt 0 ]; then
            echo "review posted: $posted substantive claude[bot] comment(s) since ${SINCE}"
            exit 0
          fi
          echo "::error::claude-review ran to completion but posted NO comment on PR #${PR_NUMBER}."
          echo "Only comments authored by claude[bot], newer than ${SINCE}, and longer than 200"
          echo "characters count — a human comment on the PR does not satisfy this check. If the"
          echo "action's posting identity ever changes, this reports a false negative (visible and"
          echo "non-blocking) rather than a false green; confirm with:"
          echo "  gh api repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments --jq '.[].user.login'"
          echo "The most common cause is tool-permission starvation: --allowed-tools REPLACES the"
          echo "action's defaults, so anything absent from that list is denied, each denial burns a"
          echo "turn, and the reviewer can exhaust itself before reaching the mandated final post."
          echo ""
          echo "Read PRODUCTIVE TURNS, not the denial ratio: (num_turns - permission_denials_count)"
          echo "from this job's result block above. Measured across four runs on PR #177 —"
          echo "  POSTED  53 turns / 12 denials -> 41 productive"
          echo "  silent  27 turns / 12 denials -> 15 productive"
          echo "  silent  16 turns /  5 denials -> 11 productive"
          echo "  silent  44 turns / 39 denials ->  5 productive"
          echo "Below roughly 20 productive turns the reviewer does not reach the post. Note the"
          echo "ratio does NOT separate these: the run that POSTED sat at 23% denials while a"
          echo "silent one sat at 31%. An earlier version of this message advised the opposite,"
          echo "citing PR #147 bands (36-46% posted, 53-93% silent); the PR #177 data falsifies"
          echo "that reading, so trust the productive-turn count instead."
          echo ""
          echo "Note this log records only the AGGREGATE denial count, never WHICH command was"
          echo "refused — so the fix is inferred from the allowlist, not read off the run."
          exit 1
