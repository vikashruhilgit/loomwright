name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version consistency
        run: |
          bash scripts/validate-version.sh --self-test
          bash scripts/validate-version.sh

      - name: Check command-wrapper sync (prevent canonical-prompt drift)
        run: bash scripts/check-command-sync.sh

      - name: Check documentation currency (version/count drift gate)
        run: bash scripts/check-doc-currency.sh

      - name: Check skills-index sync (SKILLS_INDEX.md version-cell parity gate)
        run: |
          bash scripts/check-skills-index-sync.sh --self-test
          bash scripts/check-skills-index-sync.sh

      - name: Check hook-prompt contract parity (hook-rejection-trap gate)
        run: bash scripts/check-contract-parity.sh

      - name: Check per-agent prompt token budgets (prompt-inventory ratchet)
        run: |
          bash scripts/test-check-token-budget.sh
          bash scripts/check-token-budget.sh

      - name: Check shared agent prefix (byte-identity gate)
        run: |
          bash scripts/test-check-shared-prefix.sh
          bash scripts/check-shared-prefix.sh

      # Self-test for the plugin-aware hard-gate harness below. Kept as its own
      # named step for the same reason as the two above: these root
      # scripts/test-*.sh files are NOT matched by the harness (it globs each
      # PLUGIN's scripts/, and the repo root is not a plugin), so an unnamed one
      # would silently never run.
      - name: Check plugin self-test harness (per-plugin loud-on-empty gate)
        run: bash scripts/test-check-plugin-selftests.sh

      - name: Run full deterministic self-test suite (hard gate)
        env:
          # build-vault.sh's idempotency assertion (#3 in test-build-vault.sh) FAILS on
          # ubuntu/ext4 but passes on macOS (unsorted dir enumeration churned by an in-$DEST
          # mktemp). Skip ONLY that one assertion group so the test file's other groups —
          # including the path-escape / write-containment SAFETY checks (#5/#6) — keep
          # hard-gating. Pre-existing build-vault bug, tracked in issue #40; drop this env
          # once #40 lands.
          BUILD_VAULT_SKIP_IDEMPOTENCY: "1"
        # The loop this step used to inline globbed `loomwright/scripts/test-*.sh`
        # only, so a `selvedge/scripts/test-*.sh` would never have run. It now
        # lives in scripts/check-plugin-selftests.sh, which discovers every
        # plugin in .claude-plugin/marketplace.json and keeps the loud-on-empty
        # property PER PLUGIN (a scripts/ dir with no test-*.sh fails and names
        # the plugin; a plugin with no scripts/ dir is skipped silently).
        #
        # Extracting it is the point, not incidental: loop logic inlined in a
        # workflow file cannot be tested — it can only be pushed and watched.
        # In a script it has a self-test (run in the step above) whose
        # loud-on-empty branch is mutation-controlled against fixture trees.
        # Verified equivalent at extraction: 60 suites enumerated, same as the
        # inline glob. ONE deliberate behavioural difference, stated rather than
        # left for a reader to discover: the inline loop ran under `set -e` and
        # aborted on the FIRST failing suite; the harness runs every suite and
        # fails at the end, so one CI run reports all failures instead of only
        # the earliest.
        run: bash scripts/check-plugin-selftests.sh

      # The sdk-spike suite is NOT matched by the harness's per-plugin
      # `<plugin>/scripts/test-*.sh` glob (it lives under
      # `loomwright/sdk-spike/test/`), so until v15.20.0 it never ran in CI at
      # all — while `src/runner.ts` absorbed 13 fix commits on this feature's branch alone.
      # Its two suites additionally self-SKIP unless `dist/runner.js` exists, and `dist/` is
      # gitignored, so merely invoking them without a build would reproduce the same
      # silently-green non-gate. Build first, then assert the suites actually RAN.
      - name: Set up Node (for the quarantined sdk-spike suite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: loomwright/sdk-spike/package-lock.json

      - name: Build + run sdk-spike suites (hard gate — fails closed on skip)
        working-directory: loomwright/sdk-spike
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # `dist/runner.js` is the exact artifact both suites gate their own execution on.
          # Assert it BEFORE running them: without it they exit 0 having tested nothing, which
          # is the failure mode this whole step exists to close.
          [ -f dist/runner.js ] || { echo "sdk-spike: build produced no dist/runner.js — suites would silently skip" >&2; exit 1; }
          for t in test/self-test.sh test/digest-lanes.test.sh; do
            echo "== $t =="
            # errexit is deliberately lifted across the capture: under `set -e` an assignment
            # from a failing command substitution aborts the step BEFORE `status=$?` is read,
            # which would swallow the suite's own output — the thing a CI reader needs most.
            set +e
            out="$(bash "$t" 2>&1)"; status=$?
            set -e
            echo "$out"
            [ "$status" -eq 0 ] || exit "$status"
            # Fail CLOSED on the all-checks-skipped sentinel. A suite that skipped itself is
            # UNVERIFIED, not clean — the same bimodal invariant the plugin applies to its own
            # correctness gates (CLAUDE.md §"Failure-Mode Invariants").
            case "$out" in
              *"all checks skipped"*)
                echo "sdk-spike: $t reported all checks skipped — treating as FAILURE (gate must not pass unverified)" >&2
                exit 1 ;;
            esac
          done

      - name: Advisory fitness report (non-gating)
        continue-on-error: true
        run: bash loomwright/scripts/ci-fitness-report.sh >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload eval results history (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .supervisor/eval/results.jsonl
          if-no-files-found: ignore
