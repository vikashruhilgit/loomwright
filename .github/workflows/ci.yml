name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Three jobs (iq02 T08). Branch protection requires the context `ci`, so exactly ONE job is named
  # `ci`: the aggregator at the end. `static` runs every gate step; `suite` shards the self-test suite
  # over a matrix. A job skipped because a `needs:` failed reports `skipped`, which a required check
  # treats as passing — so `ci` runs with `if: always()` and fails unless both needs succeeded.
  static:
    runs-on: ubuntu-latest
    # The static gates + test-ci-local.sh + the sdk-spike build take ~3 min (run 37809076650: gates
    # 31 s, test-ci-local 40 s, sdk-spike 8 s, plus setup). 20 is a backstop for a hung gate step.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version consistency
        run: |
          bash scripts/validate-version.sh --self-test
          bash scripts/validate-version.sh

      - name: Check command-wrapper sync (prevent canonical-prompt drift)
        run: bash scripts/check-command-sync.sh

      - name: Check documentation currency (version/count drift gate)
        run: |
          bash scripts/test-check-doc-currency.sh
          bash scripts/check-doc-currency.sh

      - name: Check skills-index sync (SKILLS_INDEX.md version-cell parity gate)
        run: |
          bash scripts/check-skills-index-sync.sh --self-test
          bash scripts/check-skills-index-sync.sh

      - name: Check hook-prompt contract parity (hook-rejection-trap gate)
        run: bash scripts/check-contract-parity.sh

      - name: Check per-agent prompt token budgets (prompt-inventory ratchet)
        run: |
          bash scripts/test-check-token-budget.sh
          bash scripts/check-token-budget.sh

      # Named EXPLICITLY, both of them: the "full deterministic self-test suite" step
      # below globs `loomwright/scripts/test-*.sh` only, so a test living in root
      # `scripts/` is not auto-included. A mutation control CI never invokes is not a
      # control — which is the exact failure this gate exists to end. No `|| true`:
      # fail-CLOSED correctness gate (CLAUDE.md §"Failure-Mode Invariants").
      # The gate's raise_check compares the manifest's allowances with main's, so main must be
      # resolvable here: actions/checkout fetches only the PR ref at depth 1. The explicit refspec
      # writes a DEDICATED ref (not refs/remotes/origin/main), so no later step that consults
      # origin/main changes behaviour, and VENDOR_COUPLING_REQUIRE_BASE=1 makes a skipped raise
      # check an ERROR, so a broken fetch fails this step instead of skipping it forever.
      - name: Check vendor-coupling ratchet (portability gate)
        env:
          VENDOR_COUPLING_BASE: refs/vendor-coupling/base
          VENDOR_COUPLING_REQUIRE_BASE: "1"
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/vendor-coupling/base
          bash scripts/test-check-vendor-coupling.sh
          bash scripts/check-vendor-coupling.sh

      - name: Check shared agent prefix (byte-identity gate)
        run: |
          bash scripts/test-check-shared-prefix.sh
          bash scripts/check-shared-prefix.sh

      # Every self-test must source loomwright/scripts/hermetic-test-env.sh as its first executable
      # line: egress env vars scrubbed, and PATH-resolved OS notifiers + curl/wget replaced by
      # recording stubs. It does NOT touch HOME or stub gh, so the user-scope
      # ~/.claude/loomwright/egress.json (webhook_url, telemetry consent + telemetry_repo) still
      # resolves — a test that exercises webhook/telemetry resolution must also sandbox HOME.
      # Root scripts/test-*.sh are not globbed by run-self-tests.sh, hence the explicit self-test
      # line. No `|| true`: fail-CLOSED correctness gate (CLAUDE.md §"Failure-Mode Invariants").
      - name: Check self-tests are egress-hermetic (ratchet)
        run: |
          bash scripts/test-check-test-hermetic.sh
          bash scripts/check-test-hermetic.sh

      # No shell script may run a command under a TEMPORARY locale assignment (`LC_ALL=C sort`);
      # write `env LC_ALL=C sort`. Homebrew bash 5.3 on macOS segfaults (exit 139, empty output)
      # restoring the locale in a forked subshell — CoreFoundation is not fork-safe — so the crash
      # only reproduces on developer Macs, never on this Linux runner; the gate is the only thing
      # that stops the shape coming back. Root scripts/test-*.sh are not globbed by
      # run-self-tests.sh, hence the explicit self-test line. No `|| true`: fail-CLOSED gate.
      - name: Check for temporary locale prefixes (bash 5.3 macOS segfault)
        run: |
          bash scripts/test-check-locale-prefix.sh
          bash scripts/check-locale-prefix.sh

      # loomwright/capabilities.json is the generated, versioned contract a host reads instead of
      # parsing plugin internals (loomwright/docs/CAPABILITIES_CONTRACT.md). Regenerate it and fail on
      # any byte of drift, so a release can never ship a stale contract. scripts/ci-local.sh picks this
      # line up too (it derives `bash loomwright/scripts/<x>.sh --check` lines as gates). The
      # generator's own self-test runs in the self-test suite below. No `|| true`: fail-CLOSED gate.
      - name: Check the capability contract is current (capabilities.json staleness gate)
        run: bash loomwright/scripts/build-capabilities.sh --check

      # scripts/ci-local.sh is the local mirror of the static + suite jobs (it derives its gate list from the
      # `bash scripts/…` lines and the `bash loomwright/scripts/<x>.sh --check` lines in THIS file). Its self-test drives fixture repos only, never the
      # real suite. Root scripts/test-*.sh are not globbed by run-self-tests.sh, hence explicit.
      - name: Check the local pre-push runner (ci-local.sh)
        run: bash scripts/test-ci-local.sh

      # Read-only run-history pull (meta-sync-followups/07, D.3). Since this repo moved its run
      # history to a metadata branch, a CI checkout has no .supervisor/jobs/done/, so the sdk-spike
      # corpus sweep below prints SKIP. Placement is deliberate: AFTER every test step of THIS job
      # (two suite tests change behaviour when real run history is present — the suite now runs in
      # the `suite` job's own fresh checkouts, so the pull cannot reach it) and BEFORE the sdk-spike
      # steps. `meta-sync.sh pull` never pushes. The branch comes from the COMMITTED .gitignore
      # mode line (`setup-memory.sh mode`); default mode, a missing remote branch, or any failure
      # is reported and leaves the job exactly as before — this step can never fail the job.
      - name: Pull run history from the metadata branch (read-only, never fails the job)
        continue-on-error: true
        run: |
          mode="$(bash loomwright/scripts/setup-memory.sh --root "$GITHUB_WORKSPACE" mode 2>/dev/null | head -n 1)"
          case "$mode" in
            "on "*) branch="${mode#on }" ;;
            *) echo "meta-sync pull skipped: mode is '${mode:-<unreadable>}', not branch mode"; exit 0 ;;
          esac
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "meta-sync pull skipped: origin has no branch '$branch' (or origin is unreachable)"
            exit 0
          fi
          if bash loomwright/scripts/meta-sync.sh pull --branch "$branch" --root "$GITHUB_WORKSPACE"; then
            echo "meta-sync pull: run history restored from '$branch'"
          else
            echo "::warning::meta-sync.sh pull --branch $branch failed; continuing without run history"
          fi

      # The sdk-spike suite is NOT matched by the `loomwright/scripts/test-*.sh` glob of the suite job
      # (it lives under `loomwright/sdk-spike/test/`), so until v15.20.0 it never ran in CI at
      # all — while `src/runner.ts` absorbed 13 fix commits on this feature's branch alone.
      # Its two suites additionally self-SKIP unless `dist/runner.js` exists, and `dist/` is
      # gitignored, so merely invoking them without a build would reproduce the same
      # silently-green non-gate. Build first, then assert the suites actually RAN.
      - name: Set up Node (for the quarantined sdk-spike suite)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: loomwright/sdk-spike/package-lock.json

      - name: Build + run sdk-spike suites (hard gate — fails closed on skip)
        working-directory: loomwright/sdk-spike
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # `dist/runner.js` is the exact artifact both suites gate their own execution on.
          # Assert it BEFORE running them: without it they exit 0 having tested nothing, which
          # is the failure mode this whole step exists to close.
          [ -f dist/runner.js ] || { echo "sdk-spike: build produced no dist/runner.js — suites would silently skip" >&2; exit 1; }
          for t in test/self-test.sh test/digest-lanes.test.sh; do
            echo "== $t =="
            # errexit is deliberately lifted across the capture: under `set -e` an assignment
            # from a failing command substitution aborts the step BEFORE `status=$?` is read,
            # which would swallow the suite's own output — the thing a CI reader needs most.
            set +e
            out="$(bash "$t" 2>&1)"; status=$?
            set -e
            echo "$out"
            [ "$status" -eq 0 ] || exit "$status"
            # Fail CLOSED on the all-checks-skipped sentinel. A suite that skipped itself is
            # UNVERIFIED, not clean — the same bimodal invariant the plugin applies to its own
            # correctness gates (CLAUDE.md §"Failure-Mode Invariants").
            case "$out" in
              *"all checks skipped"*)
                echo "sdk-spike: $t reported all checks skipped — treating as FAILURE (gate must not pass unverified)" >&2
                exit 1 ;;
            esac
          done

      - name: Advisory fitness report (non-gating)
        continue-on-error: true
        run: bash loomwright/scripts/ci-fitness-report.sh >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload eval results history (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: .supervisor/eval/results.jsonl
          if-no-files-found: ignore

  suite:
    runs-on: ubuntu-latest
    # Each shard is ~1/3 of the suite's weight (fixtures/self-test-weights.tsv: 1846 test-seconds on
    # run 37809076650 ⇒ ~615 per shard, ~160 s at 4-way) with a floor of the longest single test
    # (test-automate-trail.sh, 235 s on the runner) — a green shard takes ~4-5 min. The cap is the
    # backstop for anything outside run-self-tests.sh's per-test watchdog (SELF_TEST_TIMEOUT 900 s):
    # one hang in the concurrent batch plus one in a serial tail is 2 x 900 s, on top of the shard.
    timeout-minutes: 45
    strategy:
      # Every shard reports even when one is red: the `ci` job needs ALL manifests to name each test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # test-verify-walkthrough.sh's Playwright cache (its LOOMWRIGHT_VERIFY_TEST_CACHE
      # override) — defined ONCE here so the actions/cache step below and the self-test
      # step that fills it cannot disagree about the path. (`runner.temp` is not
      # available in job-level env, hence the literal.) Every shard restores it: which shard
      # owns test-verify-walkthrough.sh follows the weights file, and a restore is cheap.
      LOOMWRIGHT_VERIFY_TEST_CACHE: /tmp/loomwright-verify-walkthrough

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # test-verify-walkthrough.sh installs @playwright/test + a chromium build (~150 MB from
      # the Playwright CDN) into $LOOMWRIGHT_VERIFY_TEST_CACHE, and under CI=1 an install
      # failure is a HARD red (its AC11i arm) — so every run of the required `ci` check
      # carried a fresh download and a network dependency it did not need (measured on
      # PR #223: ~24 s of the step, and the one part of the suite that can fail on a CDN
      # hiccup). Restore that cache instead. The key is DERIVED from the script's own
      # PW_TEST_VERSION pin — the single source of truth — so bumping the pin is the only
      # thing that turns the cache over. Deliberately NO restore-keys: a near-miss cache
      # would just be re-downloaded over by the script's version-mismatch guard, saving
      # nothing. The derivation is mechanized in loomwright/scripts/read-playwright-pin.sh
      # (NOT an inline sed here — the same code the committed test exercises) and fails
      # CLOSED when the pin line cannot be read exactly once as `x.y.z` (an empty key would
      # cache nothing, silently — the same "gate that passes vacuously" this file forbids
      # elsewhere). Its pin-line mutations (range / quoted / trailing comment / missing /
      # duplicated) are committed arms of test-read-playwright-pin.sh, which the self-test
      # loop below auto-includes; no `|| true` on the call, under `set -e` a non-zero exit
      # stops the step before an empty version can be written.
      - name: Resolve the @playwright/test pin (test-verify-walkthrough.sh cache key)
        id: pw-pin
        run: |
          set -euo pipefail
          pin="$(bash loomwright/scripts/read-playwright-pin.sh)"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache @playwright/test + chromium for test-verify-walkthrough.sh
        uses: actions/cache@v6
        with:
          path: ${{ env.LOOMWRIGHT_VERIFY_TEST_CACHE }}
          key: verify-walkthrough-pw-${{ runner.os }}-${{ steps.pw-pin.outputs.version }}

      - name: Run deterministic self-test suite, shard ${{ matrix.shard }}/3 (hard gate)
        # Runs ONE shard of the WHOLE suite as a hard gate, CONCURRENTLY (one test per vCPU): the
        # shard is a deterministic greedy split of every test-*.sh and adapters/*/test-*.sh by the
        # committed weights — future tests are auto-included (default weight), anti-drift — and the
        # union of the three shards is the whole suite (test-run-self-tests.sh pins it). Every
        # failure's full log is printed and the step fails. The manifest (each test + its rc) is
        # what the `ci` job checks for a missing or duplicated test.
        env:
          SELF_TEST_MANIFEST: ${{ runner.temp }}/self-test-manifest.tsv
        run: bash loomwright/scripts/run-self-tests.sh --shard ${{ matrix.shard }}/3

      - name: Upload this shard's result manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-test-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/self-test-manifest.tsv
          if-no-files-found: error

  # The ONE job named `ci` (branch protection's required context). Inline `run:` on purpose: a
  # `bash scripts/<x>.sh` line here would become a gate in scripts/ci-local.sh, which derives its
  # gates from this file's text. Fails CLOSED: a needed job that did not succeed, a missing
  # manifest, a test missing from or duplicated across the manifests (against the runner's own
  # `--list`), or any non-zero rc.
  ci:
    needs: [static, suite]
    if: always()
    runs-on: ubuntu-latest
    # Checkout + artifact download + a list compare: under a minute. 10 is the backstop.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download every shard manifest
        uses: actions/download-artifact@v7
        with:
          pattern: self-test-manifest-*
          path: ${{ runner.temp }}/manifests

      - name: Aggregate static + every shard (fails closed)
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
          MDIR: ${{ runner.temp }}/manifests
          SHARDS: "3"
        run: |
          set -euo pipefail
          bad=0
          [ "$STATIC_RESULT" = success ] || { echo "::error::job static: $STATIC_RESULT"; bad=1; }
          [ "$SUITE_RESULT" = success ] || { echo "::error::job suite: $SUITE_RESULT"; bad=1; }
          : > "$RUNNER_TEMP/ran.tsv"
          for k in $(seq 1 "$SHARDS"); do
            m="$MDIR/self-test-manifest-$k/self-test-manifest.tsv"
            if [ -f "$m" ]; then cat "$m" >> "$RUNNER_TEMP/ran.tsv"
            else echo "::error::shard $k left no result manifest"; bad=1; fi
          done
          bash loomwright/scripts/run-self-tests.sh --list | env LC_ALL=C sort > "$RUNNER_TEMP/want.lst"
          [ -s "$RUNNER_TEMP/want.lst" ] || { echo "::error::run-self-tests.sh --list printed nothing"; bad=1; }
          cut -f3 "$RUNNER_TEMP/ran.tsv" | env LC_ALL=C sort > "$RUNNER_TEMP/ran.lst"
          dup="$(uniq -d "$RUNNER_TEMP/ran.lst")"
          [ -z "$dup" ] || { echo "::error::tests run by more than one shard:"; echo "$dup"; bad=1; }
          missing="$(env LC_ALL=C comm -23 "$RUNNER_TEMP/want.lst" "$RUNNER_TEMP/ran.lst")"
          [ -z "$missing" ] || { echo "::error::tests no shard ran:"; echo "$missing"; bad=1; }
          extra="$(env LC_ALL=C comm -13 "$RUNNER_TEMP/want.lst" "$RUNNER_TEMP/ran.lst" | uniq)"
          [ -z "$extra" ] || { echo "::error::manifest names tests outside the suite:"; echo "$extra"; bad=1; }
          red="$(awk -F'\t' '$1 != "0"' "$RUNNER_TEMP/ran.tsv")"
          [ -z "$red" ] || { echo "::error::non-zero results:"; echo "$red"; bad=1; }
          echo "ci: $(wc -l < "$RUNNER_TEMP/ran.lst" | tr -d ' ') test results from $SHARDS shards against $(wc -l < "$RUNNER_TEMP/want.lst" | tr -d ' ') listed"
          exit "$bad"
