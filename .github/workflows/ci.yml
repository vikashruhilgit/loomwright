name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # test-verify-walkthrough.sh's Playwright cache (its LOOMWRIGHT_VERIFY_TEST_CACHE
      # override) — defined ONCE here so the actions/cache step below and the self-test
      # step that fills it cannot disagree about the path. (`runner.temp` is not
      # available in job-level env, hence the literal.)
      LOOMWRIGHT_VERIFY_TEST_CACHE: /tmp/loomwright-verify-walkthrough

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version consistency
        run: |
          bash scripts/validate-version.sh --self-test
          bash scripts/validate-version.sh

      - name: Check command-wrapper sync (prevent canonical-prompt drift)
        run: bash scripts/check-command-sync.sh

      - name: Check documentation currency (version/count drift gate)
        run: |
          bash scripts/test-check-doc-currency.sh
          bash scripts/check-doc-currency.sh

      - name: Check skills-index sync (SKILLS_INDEX.md version-cell parity gate)
        run: |
          bash scripts/check-skills-index-sync.sh --self-test
          bash scripts/check-skills-index-sync.sh

      - name: Check hook-prompt contract parity (hook-rejection-trap gate)
        run: bash scripts/check-contract-parity.sh

      - name: Check per-agent prompt token budgets (prompt-inventory ratchet)
        run: |
          bash scripts/test-check-token-budget.sh
          bash scripts/check-token-budget.sh

      # Named EXPLICITLY, both of them: the "full deterministic self-test suite" step
      # below globs `loomwright/scripts/test-*.sh` only, so a test living in root
      # `scripts/` is not auto-included. A mutation control CI never invokes is not a
      # control — which is the exact failure this gate exists to end. No `|| true`:
      # fail-CLOSED correctness gate (CLAUDE.md §"Failure-Mode Invariants").
      - name: Check vendor-coupling ratchet (portability gate)
        run: |
          bash scripts/test-check-vendor-coupling.sh
          bash scripts/check-vendor-coupling.sh

      - name: Check shared agent prefix (byte-identity gate)
        run: |
          bash scripts/test-check-shared-prefix.sh
          bash scripts/check-shared-prefix.sh

      # test-verify-walkthrough.sh installs @playwright/test + a chromium build (~150 MB from
      # the Playwright CDN) into $LOOMWRIGHT_VERIFY_TEST_CACHE, and under CI=1 an install
      # failure is a HARD red (its AC11i arm) — so every run of the required `ci` check
      # carried a fresh download and a network dependency it did not need (measured on
      # PR #223: ~24 s of the step, and the one part of the suite that can fail on a CDN
      # hiccup). Restore that cache instead. The key is DERIVED from the script's own
      # PW_TEST_VERSION pin — the single source of truth — so bumping the pin is the only
      # thing that turns the cache over. Deliberately NO restore-keys: a near-miss cache
      # would just be re-downloaded over by the script's version-mismatch guard, saving
      # nothing. The derivation is mechanized in loomwright/scripts/read-playwright-pin.sh
      # (NOT an inline sed here — the same code the committed test exercises) and fails
      # CLOSED when the pin line cannot be read exactly once as `x.y.z` (an empty key would
      # cache nothing, silently — the same "gate that passes vacuously" this file forbids
      # elsewhere). Its pin-line mutations (range / quoted / trailing comment / missing /
      # duplicated) are committed arms of test-read-playwright-pin.sh, which the self-test
      # loop below auto-includes; no `|| true` on the call, under `set -e` a non-zero exit
      # stops the step before an empty version can be written.
      - name: Resolve the @playwright/test pin (test-verify-walkthrough.sh cache key)
        id: pw-pin
        run: |
          set -euo pipefail
          pin="$(bash loomwright/scripts/read-playwright-pin.sh)"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache @playwright/test + chromium for test-verify-walkthrough.sh
        uses: actions/cache@v6
        with:
          path: ${{ env.LOOMWRIGHT_VERIFY_TEST_CACHE }}
          key: verify-walkthrough-pw-${{ runner.os }}-${{ steps.pw-pin.outputs.version }}

      - name: Run full deterministic self-test suite (hard gate)
        env:
          # build-vault.sh's idempotency assertion (#3 in test-build-vault.sh) FAILS on
          # ubuntu/ext4 but passes on macOS (unsorted dir enumeration churned by an in-$DEST
          # mktemp). Skip ONLY that one assertion group so the test file's other groups —
          # including the path-escape / write-containment SAFETY checks (#5/#6) — keep
          # hard-gating. Pre-existing build-vault bug, tracked in issue #40; drop this env
          # once #40 lands.
          BUILD_VAULT_SKIP_IDEMPOTENCY: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Loops over the WHOLE suite as a hard gate (every test-*.sh runs; future tests are
          # auto-included — anti-drift), failing the job on the first non-zero exit. nullglob +
          # the count check make a moved/renamed scripts dir fail LOUDLY ("no self-tests found")
          # rather than passing the literal glob to bash as a confusing "No such file".
          # The second glob covers loomwright/scripts/adapters/<tool>/test-*.sh — third-party
          # adapter self-tests (docs/ARCHITECTURE_CONTRACTS.md §"Portability") live one
          # directory deeper than the flat first glob reaches, so without this they would be a
          # committed test nothing ever runs (the exact silently-green non-gate the sdk-spike
          # suite below this step was already fixed for, for the same reason).
          tests=(loomwright/scripts/test-*.sh loomwright/scripts/adapters/*/test-*.sh)
          [ "${#tests[@]}" -gt 0 ] || { echo "no self-tests found (loomwright/scripts/test-*.sh, loomwright/scripts/adapters/*/test-*.sh) — anti-drift loop matched nothing" >&2; exit 1; }
          for t in "${tests[@]}"; do
            echo "== $t =="
            bash "$t"
          done

      # The sdk-spike suite is NOT matched by the `loomwright/scripts/test-*.sh` glob above
      # (it lives under `loomwright/sdk-spike/test/`), so until v15.20.0 it never ran in CI at
      # all — while `src/runner.ts` absorbed 13 fix commits on this feature's branch alone.
      # Its two suites additionally self-SKIP unless `dist/runner.js` exists, and `dist/` is
      # gitignored, so merely invoking them without a build would reproduce the same
      # silently-green non-gate. Build first, then assert the suites actually RAN.
      - name: Set up Node (for the quarantined sdk-spike suite)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: loomwright/sdk-spike/package-lock.json

      - name: Build + run sdk-spike suites (hard gate — fails closed on skip)
        working-directory: loomwright/sdk-spike
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # `dist/runner.js` is the exact artifact both suites gate their own execution on.
          # Assert it BEFORE running them: without it they exit 0 having tested nothing, which
          # is the failure mode this whole step exists to close.
          [ -f dist/runner.js ] || { echo "sdk-spike: build produced no dist/runner.js — suites would silently skip" >&2; exit 1; }
          for t in test/self-test.sh test/digest-lanes.test.sh; do
            echo "== $t =="
            # errexit is deliberately lifted across the capture: under `set -e` an assignment
            # from a failing command substitution aborts the step BEFORE `status=$?` is read,
            # which would swallow the suite's own output — the thing a CI reader needs most.
            set +e
            out="$(bash "$t" 2>&1)"; status=$?
            set -e
            echo "$out"
            [ "$status" -eq 0 ] || exit "$status"
            # Fail CLOSED on the all-checks-skipped sentinel. A suite that skipped itself is
            # UNVERIFIED, not clean — the same bimodal invariant the plugin applies to its own
            # correctness gates (CLAUDE.md §"Failure-Mode Invariants").
            case "$out" in
              *"all checks skipped"*)
                echo "sdk-spike: $t reported all checks skipped — treating as FAILURE (gate must not pass unverified)" >&2
                exit 1 ;;
            esac
          done

      - name: Advisory fitness report (non-gating)
        continue-on-error: true
        run: bash loomwright/scripts/ci-fitness-report.sh >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload eval results history (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: .supervisor/eval/results.jsonl
          if-no-files-found: ignore
